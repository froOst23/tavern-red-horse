<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🐎 Таверна "Красная лошадь" - Магическая Админка</title>
        <link rel="stylesheet" href="/static/admin.css">
        <link rel="stylesheet" href="/static/admin-adaptive.css">
        <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=MedievalSharp&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="tavern-sign">
            <h1>Магическая Админка</h1>
        </div>

        <div class="scroll-container">
            <div class="parchment">
                <h2>🏆 Свиток Команд</h2>
                <div id="teams-container"></div>

                <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-around;">
                    <div class="magic-card add-card" id="create-team">
                        <h3>✨ Призвать команду</h3>
                        <div class="input-group">
                            <input type="text" id="new-team-name" class="enchanted-input" placeholder="Начертать имя команды...">
                            <button id="create-team-btn" class="magic-btn" onclick="createTeam()">
                                <span class="sparkle">✨</span>
                                Создать
                            </button>
                        </div>
                    </div>
                </div>

                <div class="event-container">
                    <div class="current-event-card">
                        <h3>🎯 Текущее Событие</h3>
                        <div id="active-player"></div>
                        <div id="game-round"></div>
                        <div id="current-event-display">
                            <div class="no-current-event">Нет активных событий</div>
                        </div>
                        <div>
                            <button id="next-event-btn" class="magic-btn next-event-btn" onclick="nextEvent()" disabled>
                                <span class="sparkle">🔄</span>
                                Дальше!
                            </button>
                        </div>
                    </div>
                </div>

                <div class="reset-section">
                    <button id="reset-btn" class="danger-btn ancient" onclick="resetTeams()">
                        🔥 Перерождение мира
                    </button>
                </div>
                <div id="turn-order-container" class="turn-order-container"></div>
            </div>

        </div>

        <div class="scroll-container">
            <div class="parchment">
                <h2>🔮 Свиток Событий</h2>

                <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-around;">
                    <div class="magic-card add-card">
                        <h3>🌌 Создать событие</h3>
                        <div class="form-group">
                            <label for="new-event-title"></label>
                            <input type="text" id="new-event-title" class="enchanted-input" placeholder="Имя события...">
                        </div>
                        <div class="form-group">
                            <label for="new-event-description"></label>
                            <textarea id="new-event-description" class="enchanted-input event-description" placeholder="Пророчество события..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="new-event-type"></label>
                            <input type="text" id="new-event-type" class="enchanted-input" placeholder="Тип события...">
                        </div>
                        <div class="form-group">
                            <label for="new-event-difficulty"></label>
                            <input id="new-event-difficulty" class="enchanted-input event-description" placeholder="Сложность события...">
                        </div>
                        <div class="form-group">
                            <label for="new-event-victory-effect"></label>
                            <textarea id="new-event-victory-effect" class="enchanted-input event-description" placeholder="Эффект победы..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="new-event-defeat-effect"></label>
                            <textarea id="new-event-defeat-effect" class="enchanted-input event-description" placeholder="Эффект поражения..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="new-event-requirement"></label>
                            <textarea id="new-event-requirement" class="enchanted-input event-description" placeholder="Зависимость для события..."></textarea>
                        </div>
                        <label class="file-label">
                            <input type="checkbox" id="new-event-init">
                            Начальная карта
                        </label>
                        <div class="form-group">
                            <label class="file-label" for="new-event-image">
                                📜 Выбрать магический свиток (изображение)
                            </label>
                            <div id="file-name" ></div>
                            <input type="file" id="new-event-image" class="file-input" accept="image/*">
                        </div>
                        <button class="magic-btn" id="create-event-btn">
                            <span class="sparkle">🌟</span>
                            Создать
                        </button>
                    </div>
                </div>
                <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-around;">
                    <div id="events-container"></div>
                </div>
            </div>
        </div>

        <div class="fire-torches">
            <div class="torch left"></div>
            <div class="torch right"></div>
        </div>

        <script src="/static/admin.js"></script>
    </body>
</html>

<script>
    const fileInput = document.getElementById('new-event-image');
    const fileNameDisplay = document.getElementById('file-name');

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            fileNameDisplay.textContent = `Выбран файл: ${fileInput.files[0].name}`;
        } else {
            fileNameDisplay.textContent = '';
        }
    });
</script>

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Оптимизации
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Кэш для изображений событий (только для старых/использованных)
    proxy_cache_path /var/cache/nginx/events
                     levels=1:2
                     keys_zone=events_cache:10m
                     max_size=1g
                     inactive=1h  # Уменьшаем время жизни кэша
                     use_temp_path=off;

    # Кэш для API
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_cache:5m
                     max_size=100m
                     inactive=1h
                     use_temp_path=off;

    # Upstream для приложения
    upstream tavern_app {
        server red-horse-tavern:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Добавляем CORS заголовки если нужно
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";

        # Статические файлы (CSS, JS, HTML) - отдаём напрямую из volume
        location /static/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Static "true";

            # Если файл не найден, пробуем получить из приложения
            try_files $uri @app_static;
        }

        location @app_static {
            proxy_pass http://tavern_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Изображения событий - ОБНОВЛЕННАЯ КОНФИГУРАЦИЯ
        location /static/events/ {
            proxy_pass http://tavern_app;

            # Кэшируем только если в ответе есть Cache-Control
            proxy_cache events_cache;
            proxy_cache_valid 200 302 5m;  # Уменьшаем время кэша до 5 минут
            proxy_cache_bypass $http_cache_control;  # Обходим кэш если клиент просит
            proxy_no_cache $http_pragma $http_authorization;  # Не кэшируем при определенных заголовках

            # Добавляем заголовки для инвалидации кэша
            add_header X-Proxy-Cache $upstream_cache_status;
            add_header X-Cache-Bypass "true";

            # Проксируем необходимые заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Важно: не устанавливаем expires здесь, пусть приложение управляет кэшем
        }

        # WebSocket для viewer
        location /viewer/ws {
            proxy_pass http://tavern_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API endpoints - НЕ кэшируем вообще
        location /api/ {
            proxy_pass http://tavern_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Явно отключаем кэширование для API
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Next Event endpoint - особо важно не кэшировать
        location /api/admin/events/next {
            proxy_pass http://tavern_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache off;
            add_header Cache-Control "no-cache";
        }

        # Всё остальное - в приложение
        location / {
            proxy_pass http://tavern_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Оптимизации
        client_max_body_size 50M;
        gzip on;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            image/svg+xml;
    }
}
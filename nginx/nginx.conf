events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Оптимизации
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Кэш для изображений событий
    proxy_cache_path /var/cache/nginx/events
                     levels=1:2
                     keys_zone=events_cache:10m
                     max_size=1g
                     inactive=365d
                     use_temp_path=off;

    # Кэш для API
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_cache:5m
                     max_size=100m
                     inactive=1h
                     use_temp_path=off;

    # Upstream для приложения
    upstream tavern_app {
        server red-horse-tavern:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Статические файлы (CSS, JS, HTML) - отдаём напрямую из volume
        location /static/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Static "true";

            # Если файл не найден, пробуем получить из приложения
            try_files $uri @app_static;
        }

        location @app_static {
            proxy_pass http://tavern_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Изображения событий - кэшируем агрессивно
        location /static/events/ {
            proxy_pass http://tavern_app;
            proxy_cache events_cache;
            proxy_cache_valid 200 302 1y;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Заголовки кэширования
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Proxy-Cache $upstream_cache_status;

            # Проксируем необходимые заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket для viewer
        location /viewer/ws {
            proxy_pass http://tavern_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API endpoints - минимальное кэширование
        location /api/ {
            proxy_pass http://tavern_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Короткое кэширование для GET запросов API
            proxy_cache api_cache;
            proxy_cache_valid 200 302 10s;
            proxy_cache_methods GET HEAD;
            add_header X-API-Cache $upstream_cache_status;
        }

        # Всё остальное - в приложение
        location / {
            proxy_pass http://tavern_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Мониторинг кэша (опционально)
        location /nginx-cache-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Оптимизации
        client_max_body_size 50M;
        gzip on;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            image/svg+xml;
    }
}
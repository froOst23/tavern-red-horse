services:
  nginx:
    image: nginx:alpine
    container_name: "tavern-nginx"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/cache:/var/cache/nginx
      - ./static:/usr/share/nginx/html/static:ro  # статика напрямую из nginx
    depends_on:
      - red-horse-tavern
    networks:
      - tavern-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  red-horse-tavern:
    build:
      context: .
    container_name: "red-horse-tavern"
    # Убираем проброс порта наружу, т.к. nginx будет проксировать
    # ports:
    #   - "5000:5000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - ./application.yaml:/opt/conf/application.yaml
    networks:
      - tavern-network
    environment:
      - APP_PORT=5000  # убедитесь что приложение слушает на 5000

networks:
  tavern-network:
    driver: bridge

volumes:
  nginx-cache:
